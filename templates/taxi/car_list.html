{% extends "base.html" %}

{% block content %}
    <h1>Cars List</h1>
    {% if car_list %}
        <table>
            {% for car in car_list %}
                <tr>
                    <td><a href={% url "taxi:car-detail" car.id %}>{{ car.model }}</a></td>
                </tr>
            {% endfor %}
        </table>
    {% endif %}
{% endblock %}
